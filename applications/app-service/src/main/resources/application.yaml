server:
  port: "${SERVER_PORT:8090}"
spring:
  application:
    name: "credit-aplication-microservice"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    timeout: 5000
    url: "${AUTH_SERVICE_URL}"
  sqs:
    region: ${AWS_REGION}
    queueEmailUpdateStatusCreditApplicationUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/notificationsEmail"
    queueInitFlowAutomaticValidationUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/init-flow-automatic-validation"
    queueCalculateDebtCapacityUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/calculate-debt-capacity"
    queueMetricCreditApprovedUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/metric-reports"
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    schema: "${DB_SCHEMA}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
routes:
  paths:
    applications: "/api/v1/solicitudes"
    applicationsPending: "/api/v1/solicitudes/pendientes"
jwt:
  token:
    secret-key: "${JWT_SECRET}"
entrypoint:
  sqs:
    region: ${AWS_REGION}
    queueInitFlowAutomaticValidationUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/init-flow-automatic-validation"
    queueCalculateDebtCapacityResponseUrl: "https://sqs.us-east-2.amazonaws.com/575108950970/calculate-debt-capacity-response"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
